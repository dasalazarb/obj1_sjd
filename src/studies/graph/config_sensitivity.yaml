study_name: graph_representation_sensitivity
contract_version: clinical_episode_curated_v2
feature_policy: legacy_with_overlap
input_governance:
  required_pharma_profile_contract: pharma_lab_profile_v2
  require_clinical_release: true
  require_nonempty_lab_block: true
  categorical_baseline_coverage_policy: same_as_numeric
random_seed: 20260831

lab_grouping:
  enabled_scenario: S4
  key_column: lab
  group_column: s4_group
  subgroup_column: s4_subgroup
  require_complete_mapping: true
  map_file: data/raw/graph_s4_lab_group_map.csv

feature_selection:
  lab_minimum_baseline_coverage: 0.70
  pro_minimum_baseline_coverage: 0.60
  clinical_minimum_baseline_coverage: 0.70

redundancy:
  spearman_abs_threshold: 0.95
  conceptual_pairs:
    - [hemoglobin_a1c, estimated_average_glucose]

pca:
  variance_target: 0.80
  max_components: null

current_pca:
  variance_target: 0.80
  max_components: 10

mapper:
  n_cubes: 8
  perc_overlap: 0.40
  min_samples: 3
  eps_k_neighbors: 4
  eps_percentile: 65
  minimum_node_support: 3
  soft_membership_tau: 1.0

community_detection:
  method: greedy_modularity
  edge_weight: jaccard
  minimum_patients: 8

bootstrap:
  replicates: 60
  patient_fraction: 0.80
  branch_match_jaccard: 0.50
  stable_community_threshold: 0.80
  # Operational execution QC, not a biological validity or stability threshold.
  minimum_success_fraction: 0.95

comparisons:
  # Descriptive common-universe ARI needs both an absolute and relative sample floor.
  minimum_common_patients: 20
  minimum_common_fraction: 0.50

interpretation:
  # No retrospective scientific cutoffs: claims remain NOT_EVALUABLE by default.
  core_jaccard_threshold: null
  global_ari_threshold: null
  threshold_justification: null

permutation:
  ari_replicates: 5000

persistent_homology:
  enabled: true
  permutation_replicates: 150
