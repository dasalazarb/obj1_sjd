# Prespecified exploratory protocol; approvals must never be inferred.
schema_version: graph_validation_v1
baseline_characterization: true
independent_anchors: true
compare_populations: true
incremental_value: true
longitudinal_analysis_if_estimable: true
rare_events_descriptive_if_available: true
minimum_group_patients: 8
minimum_model_patients: 30
minimum_visits_per_patient: 2
minimum_patients_per_community: 8
minimum_rare_event_count: 5
effect_ci_replicates: 500
fdr_alpha: 0.05
confounders:
- demo__protocol
- demo__age_at_baseline
- demo__sex
pop_column: pop__status
date_column: clinical_anchor_date
baseline_flag: is_clinical_baseline
anchors:
- source_column: essdai__total
  type: numeric
  role: independent_baseline_anchor
  derived_from:
  - ovl__status
  unit: ESSDAI points
- source_column: esspri__total
  type: numeric
  role: independent_baseline_anchor
  derived_from:
  - esspri__dryness
  - esspri__fatigue
  - esspri__pain
  unit: ESSPRI points
longitudinal_endpoints:
- essdai__total
- esspri__total
- pro__sf36_pcs
- pro__profad_total
- pro__mdafs_global
rare_events: []
projection:
  enabled: false
  reason: No independently validated out-of-sample Mapper projection protocol
causal_or_predictive_claims: false

# No endpoint date or identity field is approved from its name alone. Populate
# endpoint_policies only after reviewing source schema and measurement lineage.
temporal_resolution:
  schema_version: graph03_episode_resolution_v1
  audit_before_modeling: true
  reject_unverified_measurement_dates: true
  collapse_only_verified_exact_duplicates: true
  allow_arbitrary_first_last_mean: false
  reject_unresolved_within_episode_conflicts: true
  treat_same_day_distinct_episodes_as_separate_only_if_verified: true
  emit_aggregate_qc: true
  preserve_strict_post_index: true
  endpoint_policies: {}
clinical_marker_panels:
- source_column: ext__ocular_schirmer_min
  label: Schirmer minimum
  unit: source_units_pending_review
  clinical_domain: D01
- source_column: ext__ocular_oxford_max
  label: Oxford maximum
  unit: source_units_pending_review
  clinical_domain: D01
- source_column: ext__salivary_flow_unstimulated
  label: Unstimulated salivary flow
  unit: source_units_pending_review
  clinical_domain: D02
- source_column: lab__anti_ro_ssa__text
  label: Anti-Ro/SSA
  unit: reported_category
  clinical_domain: D03
- source_column: lab__anti_la_ssb__text
  label: Anti-La/SSB
  unit: reported_category
  clinical_domain: D03
- source_column: lab__igg__value
  label: IgG
  unit: source_units_pending_review
  clinical_domain: D04
- source_column: lab__complement_c3__value
  label: Complement C3
  unit: source_units_pending_review
  clinical_domain: D04
- source_column: lab__complement_c4__value
  label: Complement C4
  unit: source_units_pending_review
  clinical_domain: D04
- source_column: lab__esr__value
  label: ESR
  unit: source_units_pending_review
  clinical_domain: D05
- source_column: essdai__total
  label: ESSDAI total
  unit: ESSDAI points
  clinical_domain: D07
- source_column: esspri__total
  label: ESSPRI total
  unit: ESSPRI points
  clinical_domain: D06
- source_column: pro__sf36_pcs
  label: SF-36 PCS
  unit: SF-36 PCS points
  clinical_domain: D06
- source_column: pro__profad_total
  label: PROFAD total
  unit: PROFAD points
  clinical_domain: D06
- source_column: pro__mdafs_global
  label: MDAFS global
  unit: MDAFS points
  clinical_domain: D06

# Source-level roles are representation-specific. This contract never approves
# endpoint dates, the R2 clinical map, or independence by absence of conflicts.
characterization:
  schema_version: graph03_characterization_v1
  figure_sources: [ext__ocular_schirmer_min, ext__ocular_oxford_max,
    ext__salivary_flow_unstimulated, lab__igg__value, lab__complement_c3__value,
    pro__sf36_pcs, pro__profad_total, pro__mdafs_global]
  # Plot selection never supplies lineage evidence or changes source roles.
  figure_sources_N2:
  - source_column: ext__ocular_schirmer_right
    label: Schirmer right (component of minimum)
    related_to: ext__ocular_schirmer_min
    expected_relationship: component_of
    clinical_domain: D01
    selection_reason: interpretability_of_objective_ocular_construct
    review_status: descriptive_selection_not_clinical_approval
  - source_column: lab__igg__text
    label: IgG reported interpretation
    related_to: lab__igg__value
    expected_relationship: same_raw_source
    clinical_domain: D04
    selection_reason: qualitative_companion_to_quantitative_assay
    review_status: descriptive_selection_not_clinical_approval
  - source_column: lab__complement_c3__text
    label: C3 reported interpretation
    related_to: lab__complement_c3__value
    expected_relationship: same_raw_source
    clinical_domain: D04
    selection_reason: qualitative_companion_to_quantitative_assay
    review_status: descriptive_selection_not_clinical_approval
  figure_policy:
    disclosure_mode: conservative_whole_source_partition_v1
    restricted_view:
      enabled: false
      authorization_reference: null
      approved_output_root: null
      automatic_packaging: false
      publication_eligible: false
  independence_reviews: []
  # Review records require exact representation_id/source_column, reviewer,
  # source_reference, baseline_window, temporal_baseline_status: VERIFIED, and
  # APPROVED lineage/clinical/origin/proxy/discovery_exclusion_review_status.
  instruments:
  - instrument: ESSPRI
    source_reference: src/block_A/13_disease_activity_progression.py:ESSPRI
    source_columns: [esspri__total, esspri__dryness, esspri__fatigue, esspri__pain]
  - instrument: SF36
    source_reference: src/derivations/pro_scoring.py
    source_columns: [pro__sf36_pcs, pro__sf36_mcs, pro__sf36_physical_functioning,
      pro__sf36_role_physical, pro__sf36_bodily_pain, pro__sf36_general_health,
      pro__sf36_vitality, pro__sf36_social_functioning, pro__sf36_role_emotional,
      pro__sf36_mental_health]
  relationships:
  - source_column: pop__status
    target_source: essdai__total
    relationship_type: composite_component
    source_reference: src/block_A/observed_patterns.py:verified_baseline_pop
  - source_column: pop__status
    target_source: esspri__total
    relationship_type: composite_component
    source_reference: src/block_A/observed_patterns.py:verified_baseline_pop

# Phase A runs without choosing or approving any outcome. These reviews concern
# basal measurements only; temporal_resolution.endpoint_policies is unchanged.
n3_validation:
  schema_version: graph03_n3_audit_v1
  enabled: true
  run_candidate_inventory: true
  auto_approve_independence: false
  allow_undocumented_source_promotion: false
  enforce_representation_specific_roles: true
  require_temporal_baseline_evidence: true
  require_clinical_proxy_review: true
  exclude_current_embedding_features: true
  retain_existing_stability_gates: true
  longitudinal_endpoints_not_in_scope: true
  allow_out_of_sample_prediction_claims: false
  comparator_policy:
    use_common_complete_case_population: true
    forbid_pop_if_outcome_defines_pop: true
    compare_with_source_features_if_estimable: true
    report_in_sample_only: true
  prespecified_outcomes: []
  additional_candidate_reviews: []
  measurement_policies: []
  baseline_era_reviews: []
  pop_comparator_reviews: []
  source_comparators: []
