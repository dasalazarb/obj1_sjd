# Prespecified exploratory protocol; approvals must never be inferred.
schema_version: graph_validation_v1
baseline_characterization: true
independent_anchors: true
compare_populations: true
incremental_value: true
longitudinal_analysis_if_estimable: true
rare_events_descriptive_if_available: true
minimum_group_patients: 8
minimum_model_patients: 30
minimum_visits_per_patient: 2
minimum_patients_per_community: 8
minimum_rare_event_count: 5
effect_ci_replicates: 500
fdr_alpha: 0.05
confounders:
- demo__protocol
- demo__age_at_baseline
- demo__sex
pop_column: pop__status
date_column: clinical_anchor_date
baseline_flag: is_clinical_baseline
anchors:
- source_column: essdai__total
  type: numeric
  role: independent_baseline_anchor
  derived_from:
  - ovl__status
  unit: ESSDAI points
- source_column: esspri__total
  type: numeric
  role: independent_baseline_anchor
  derived_from:
  - esspri__dryness
  - esspri__fatigue
  - esspri__pain
  unit: ESSPRI points
longitudinal_endpoints:
- essdai__total
- esspri__total
- pro__sf36_pcs
- pro__profad_total
- pro__mdafs_global
rare_events: []
projection:
  enabled: false
  reason: No independently validated out-of-sample Mapper projection protocol
causal_or_predictive_claims: false

# No endpoint date or identity field is approved from its name alone. Populate
# endpoint_policies only after reviewing source schema and measurement lineage.
temporal_resolution:
  schema_version: graph03_episode_resolution_v1
  audit_before_modeling: true
  reject_unverified_measurement_dates: true
  collapse_only_verified_exact_duplicates: true
  allow_arbitrary_first_last_mean: false
  reject_unresolved_within_episode_conflicts: true
  treat_same_day_distinct_episodes_as_separate_only_if_verified: true
  emit_aggregate_qc: true
  preserve_strict_post_index: true
  endpoint_policies: {}
clinical_marker_panels:
- source_column: essdai__total
  label: ESSDAI total
  unit: ESSDAI points
- source_column: esspri__total
  label: ESSPRI total
  unit: ESSPRI points
- source_column: pro__sf36_pcs
  label: SF-36 PCS
  unit: SF-36 PCS points
- source_column: pro__profad_total
  label: PROFAD total
  unit: PROFAD points
- source_column: pro__mdafs_global
  label: MDAFS global
  unit: MDAFS points
