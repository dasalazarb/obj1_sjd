schema_version: graph03_n3_phasec_v1
auto_approve_independence: false
privacy_class: INTERNAL_RESTRICTED
minimum_disclosure_cell: 5
# Runs and provenance are discovered and checked automatically. Optional historical
# pins in an explicit config are checked only with --strict.
input_contract:
  n3_schema_version: graph03_n3_audit_v1
families:
  systemic_activity:
    sources: [essdai__total]
    status: PENDING_REVIEW
  symptoms:
    sources: [esspri__total]
    status: PENDING_REVIEW
  glandular_histopathology:
    sources: [ext__biopsy_focus_score]
    status: PENDING_REVIEW
