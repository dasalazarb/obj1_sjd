    sources: [lab__ana_status__text, lab__ana_hep2_status__text]
    status: PENDING_REVIEW
  rheumatoid_factor:
    sources: [lab__rheumatoid_factor__text, lab__rheumatoid_factor__value]
    status: PENDING_REVIEW
  qualitative_proteinuria:
    sources: [lab__urine_protein_qualitative__text]
    status: PENDING_REVIEW
