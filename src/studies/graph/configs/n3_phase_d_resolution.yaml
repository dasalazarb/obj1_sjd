schema_version: graph03_n3_phased_v1
privacy_class: INTERNAL_RESTRICTED
minimum_disclosure_cell: 5
# No operator-supplied paths, run IDs or hashes are needed. --strict also checks
# optional historical pins supplied in an explicit config.
input_contract:
  n3_schema_version: graph03_n3_audit_v1
policy:
  require_human_signoff: true
  allow_auto_approval: false
  allow_source_recode: false
  allow_discovery_refit: false
  allow_model_estimation: false
  allow_endpoint_policy_changes: false
  allow_public_export: false
  allow_covariate_drop: false
  allow_constant_imputation: false
  code_drift: report
proposed_reviews:
  protocol: []
  baseline_date: []
  baseline_era: []
  measurement: []
  candidate_independence: []
  pop_semantics: []
  topology_sensitivity: []
  statistical_design: []
