name: Graph study synthetic contracts
on:
  pull_request:
    paths: ['src/studies/graph/**', 'src/studies/pharma/00_profile_labs.py', 'tests/test_graph*', 'tests/test_topological_phenotyping.py', '.github/workflows/graph-study.yml']
  push:
    branches: [main, 'feature/graph02-03-rearchitecture']
    paths: ['src/studies/graph/**', 'tests/test_graph*', '.github/workflows/graph-study.yml']
permissions:
  contents: read
jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/studies/graph/requirements.txt
      - run: python -m pip install -r src/studies/graph/requirements.txt
      - name: Public synthetic sources only
        run: >-
          python -m pytest -q tests/test_graph_pipeline.py
          tests/test_graph_representation_sensitivity.py tests/test_graph_bootstrap_qc.py
          tests/test_graph_feature_catalog.py tests/test_graph_lab_contract_v2.py
          tests/test_graph_lab_ingestion.py tests/test_topological_phenotyping.py
