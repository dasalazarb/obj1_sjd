name: Semantic harmonization synthetic contracts
on:
  pull_request:
    paths:
      - 'src/semantic_harmonization/**'
      - 'src/studies/pharma/**'
      - 'src/studies/graph/**'
      - 'src/studies/economic/**'
      - 'tests/test_semantic_harmonization.py'
      - 'tests/semantic_report_browser.cjs'
      - '.github/workflows/semantic-harmonization.yml'
permissions:
  contents: read
jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/semantic_harmonization/requirements.lock
      - run: python -m pip install -r src/semantic_harmonization/requirements.lock
      - name: Install browser test harness
        run: npm install --prefix "$RUNNER_TEMP/semantic-browser" playwright@1.55.0
      - name: Validate synthetic candidate and report
        run: |
          export NODE_PATH="$RUNNER_TEMP/semantic-browser/node_modules"
          python -m pytest -q tests/test_semantic_harmonization.py
