[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sjd-research-explorer"
version = "0.1.0"
description = "Read-only presentation of published SjD research outputs"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.37,<2", "pandas>=2.2,<3", "pyyaml>=6", "pillow>=10", "pymupdf>=1.24", "plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shared*", "objectives*", "studies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
